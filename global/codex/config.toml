#:schema https://developers.openai.com/codex/config-schema.json

# MODEL SETTINGS
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
personality = "pragmatic"

# APPROVALS / SANDBOX
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

# FEATURES
[features]
multi_agent = true

# Optional: restrict sandboxed network traffic when network is enabled.
# If this causes issues with npm/MCP installs, comment it out.
# [features.network_proxy]
#enabled = true
#domains = {
#  "api.stripe.com" = "allow",
#  "**.mcp.run" = "allow",
#  "localhost" = "allow"
#}

# TUI
[tui]
notifications = true
notification_condition = "always"
notification_method = "osc9"
status_line = ["model-with-reasoning", "context-used"]
theme = "nord"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

# MCP Servers
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.aiguide]
url = "https://mcp.tigerdata.com/docs"
enabled = true
default_tools_approval_mode = "approve"

# Trusted projects
[projects."/home/sven/Projects"]
trust_level = "trusted"

[projects."/home/sven"]
trust_level = "trusted"

[projects."/home/sven/Projects/AgCore"]
trust_level = "trusted"

[projects."/home/sven/model-set"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"

[notice]
hide_full_access_warning = true
